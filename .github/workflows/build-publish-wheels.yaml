name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:   # Allows a dry-run of the whole matrix without cutting a release tag

env:
  # ── Linux toolchain pins ──────────────────────────────────────────────────
  # The whole Linux build (C core, C++ bindings and the nvcc host pass) is compiled with the
  # static LLVM toolchain that the manylinux images can install on demand, not with the
  # gcc-toolset that ships in the image. MAGNETRON_CLANG_MAJOR selects the LLVM major version;
  # the exact patch release is resolved from the image's own version list at build time.
  #
  # Do not bump this past 21 without checking crt/host_config.h of the pinned CUDA release:
  # nvcc 13.3 hard-errors on __clang_major__ >= 22 as a host compiler, so clang 22 additionally
  # needs -allow-unsupported-compiler in CMAKE_CUDA_FLAGS.
  MAGNETRON_CLANG_MAJOR: '21'

  # CUDA release used for the shipped CUDA backend, in NVIDIA's package-suffix form
  # (13-3 == 13.3). Available versions: https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/
  MAGNETRON_CUDA_VERSION: '13-3'

  # GPU architectures baked into magnetron_cuda.so. '-real' emits a native cubin for that
  # architecture, '-virtual' emits PTX that the driver JITs onto newer chips of the same family.
  #
  # sm_90 is the floor: mag_cuda_matmul.cu emits cp.async.bulk.tensor (TMA) and passes
  # __grid_constant__ CUtensorMap, both of which ptxas rejects below sm_90, and
  # magnetron/cuda/CMakeLists.txt fails the configure for anything lower. nvcc 13.x itself can
  # target Ampere and Ada just fine (only Maxwell/Pascal/Volta were dropped in CUDA 13), so once
  # the backend grows a non-TMA matmul path this is the only line that needs to change - e.g.
  # '80-real;86-real;89-real;90-real;100-real;100-virtual;120-real;120-virtual' to cover
  # RTX 30x0 (sm_86), RTX 40x0 (sm_89) and A100 (sm_80).
  MAGNETRON_CUDA_ARCHITECTURES: '90-real;100-real;100-virtual;120-real;120-virtual'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python (controller)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel build

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build wheels (Linux x86_64, Python 3.10–3.14, CPU + CUDA)
        env:
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"

          # Pinned so the CUDA repo below (rhel8) matches the image's distro. AlmaLinux 8 keeps
          # the wheels usable on glibc 2.28 and newer.
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64:latest"

          # Runs once per container, before any wheel is built.
          CIBW_BEFORE_ALL_LINUX: |
            set -eux

            # ── LLVM toolchain ────────────────────────────────────────────────────────
            # manylinux ships a helper that drops a statically linked LLVM release into
            # /opt/clang, which is already first on PATH inside the image. Unlike the
            # llvm.org tarballs it is built against an old glibc, so it runs in this container.
            command -v manylinux-install-clang >/dev/null \
              || { echo "manylinux image is too old to provide manylinux-install-clang"; exit 1; }
            CLANG_VERSION="$(manylinux-install-clang -l | grep -m1 "^v${{ env.MAGNETRON_CLANG_MAJOR }}\." || true)"
            if [ -z "${CLANG_VERSION}" ]; then
              echo "no clang ${{ env.MAGNETRON_CLANG_MAJOR }}.x in this image, available:"
              manylinux-install-clang -l
              exit 1
            fi
            manylinux-install-clang -v "${CLANG_VERSION}"

            # The release builds use -flto=thin, and this toolchain is a static LLVM without
            # LLVMgold.so, so binutils ld cannot read its bitcode - it has to link through lld.
            # This goes into the driver's config file rather than into LDFLAGS on purpose:
            # magnetron_cuda is linked by nvcc, and nvcc rejects -fuse-ld outright. Putting it
            # here keeps it on every clang invocation, including the one nvcc makes to link.
            for cfg in clang clang++; do
              echo "-fuse-ld=lld" >> "/opt/clang/bin/${cfg}.cfg"
            done
            /opt/clang/bin/clang --version

            # ── CUDA toolkit ──────────────────────────────────────────────────────────
            # cuda-minimal-build pulls nvcc, the CRT, cudart headers/libs and the CCCL headers
            # (<cuda/barrier>, <cuda/std/...>) that the backend includes; cuda-driver-devel adds
            # the libcuda stub needed to link CUDA::cuda_driver. The full cuda-toolkit meta
            # package would drag in Nsight and blow the runner's disk budget.
            dnf -y install dnf-plugins-core
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf -y install \
              cuda-minimal-build-${{ env.MAGNETRON_CUDA_VERSION }} \
              cuda-driver-devel-${{ env.MAGNETRON_CUDA_VERSION }}
            ln -sfn "/usr/local/cuda-$(echo '${{ env.MAGNETRON_CUDA_VERSION }}' | tr '-' '.')" /usr/local/cuda
            /usr/local/cuda/bin/nvcc --version

          CIBW_ENVIRONMENT_LINUX: >-
            PATH=/opt/clang/bin:/usr/local/cuda/bin:$PATH
            CC=/opt/clang/bin/clang
            CXX=/opt/clang/bin/clang++
            CUDACXX=/usr/local/cuda/bin/nvcc
            CUDAToolkit_ROOT=/usr/local/cuda
            CMAKE_ARGS='-DCMAKE_C_COMPILER=/opt/clang/bin/clang
            -DCMAKE_CXX_COMPILER=/opt/clang/bin/clang++
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
            -DCMAKE_CUDA_HOST_COMPILER=/opt/clang/bin/clang++
            -DMAGNETRON_ENABLE_BACKEND_CPU=ON
            -DMAGNETRON_ENABLE_BACKEND_CUDA=ON
            -DMAGNETRON_CUDA_ARCHITECTURES=${{ env.MAGNETRON_CUDA_ARCHITECTURES }}'

          # magnetron_cuda.so links libcuda.so.1, which is part of the NVIDIA display driver and
          # must always come from the host - bundling it would pin the wheel to one driver
          # version. Everything else (libcudart) is vendored in as usual, so the wheel needs no
          # CUDA installation on the target machine. On a box without a driver the dlopen of
          # magnetron_cuda.so simply fails and the runtime falls back to the CPU backend.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude libcuda.so.1 -w {dest_dir} {wheel}
        run: |
          python -m cibuildwheel --output-dir wheelhouse .

      # A missing CUDA toolkit only produces a CMake warning, so the backend can silently drop
      # out of the wheel. Check the archives instead of importing magnetron: the runner has no
      # NVIDIA driver, so loading the backend would fail there for unrelated reasons.
      - name: Verify the CUDA backend is in every wheel
        run: |
          for whl in wheelhouse/*.whl; do
            echo "== $whl"
            python -m zipfile -l "$whl" | grep 'magnetron_cuda' \
              || { echo "magnetron_cuda is missing from $whl"; exit 1; }
          done

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  build-macos-arm64:
    runs-on: macos-14   # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python (controller)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.* build

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pre-download virtualenv (avoid GitHub 429 during cibuildwheel)
        run: |
          CACHE_DIR="$HOME/Library/Caches/cibuildwheel"
          mkdir -p "$CACHE_DIR"
          VENV_URL="https://github.com/pypa/get-virtualenv/blob/20.30.0/public/virtualenv.pyz?raw=true"
          for i in 1 2 3 4 5; do
            curl -sSLf -o "$CACHE_DIR/virtualenv-20.30.0.pyz" "$VENV_URL" && break
            echo "Download attempt $i failed (often 429), waiting 30s..."
            sleep 30
          done
          test -f "$CACHE_DIR/virtualenv-20.30.0.pyz"

      - name: Build wheels (macOS arm64, Python 3.10–3.14)
        env:
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # No CUDA on macOS: Apple dropped NVIDIA support, so this stays a CPU-only wheel
          # built with the Xcode toolchain.
          CIBW_ENVIRONMENT_MACOS: >-
            CMAKE_ARGS='-DMAGNETRON_ENABLE_BACKEND_CUDA=OFF'
          CIBW_BEFORE_ALL_MACOS: |
            set -eux
            brew update
            brew install cmake ninja || true
        run: |
          python -m cibuildwheel --output-dir wheelhouse .

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build/publish tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist
        run: |
          mkdir -p dist
          python -m build --sdist . --outdir dist

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.10.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: dist
          skip_existing: true
