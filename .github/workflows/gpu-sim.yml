name: CUDA on simulated H100

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA backend and runs the Python tests on the CUDA device on a simulated
# NVIDIA H100 (https://github.com/pantheongpu/pantheonsim). A simulator cannot
# reproduce hardware-specific behavior or timing, so it complements real-GPU
# testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "magnetron/**"
      - "python/**"
      - "test/python/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up the simulated GPU and CUDA toolkit
      uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
      with:
        gpu: nvidia/h100
        cuda-toolkit: "13.0"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache ninja-build python3-dev python3-venv
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install numpy pytest
        "$RUNNER_TEMP/venv/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-gpu-sim-${{ github.sha }}
        restore-keys: |
          ccache-gpu-sim-

    # The simulator JIT-compiles PTX and does not run SASS, and it needs a
    # shared CUDA runtime. So only compute_90 PTX is built (90-virtual).
    - name: Build
      run: |
        ccache -z
        cmake -B build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
              -DMAGNETRON_CUDA_ARCHITECTURES=90-virtual \
              -DMAGNETRON_BUILD_TESTS=OFF \
              -DPython_EXECUTABLE="$RUNNER_TEMP/venv/bin/python"
        cmake --build build -j3
        ccache -s

    - name: Stage the Python package
      run: |
        mkdir -p stage
        cp -r python/magnetron stage/
        cp build/_magnetron_bindings*.so build/libmagnetron_*.so stage/magnetron/

    # Skipped:
    # - test_binary_op_numeric_integers[op6...] (pow): numpy raises on a random
    #   negative integer exponent, so it fails now and then on any device.
    # - test_empty_like: compares two uninitialized buffers.
    - name: Test
      env:
        PYTHONPATH: ${{ github.workspace }}/stage
      run: |
        vgpu run --preload "$RUNNER_TEMP/venv/bin/python" -m pytest -v -rfE --durations=10 -p no:cacheprovider \
          test/python \
          -k 'cuda and not (test_binary_op_numeric_integers and op6) and not test_empty_like'
