name: CMake Python Multi-Platform Build and Test

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-22.04-arm]
        build_type: [Release]
        compiler: [gcc, clang]
        include:
          - os: macos-latest
            build_type: Release
            compiler: clang
          - os: macos-14
            build_type: Release
            compiler: clang

    steps:
      - uses: actions/checkout@v4
      - name: Set reusable strings
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Linux Packages
        if: runner.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            g++ \
            clang \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Configure CMake
        shell: bash
        run: |
          # Map the matrix "compiler" to C and C++ compiler settings.
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            CC=gcc
            CXX=g++
          else
            CC=clang
            CXX=clang++
          fi
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
                -DCMAKE_C_COMPILER=$CC \
                -DCMAKE_CXX_COMPILER=$CXX \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -S "${{ github.workspace }}"

      - name: Build C++ Runtime
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} -j4

      - name: Run C++ Runtime Tests
        working-directory: "${{ steps.strings.outputs.build-output-dir }}"
        run: ctest --build-config ${{ matrix.build_type }} --verbose

      - name: Setup Python Virtual Environment
        shell: bash
        run: |
          uv venv
          source .venv/bin/activate

      - name: Build Python wheel
        shell: bash
        run: |
          uv sync --extra dev

      - name: Run Python Tests
        shell: bash
        run: |
          source .venv/bin/activate
          export MAG_LOG_LEVEL=debug
          pytest -n 4 -s "${{ github.workspace }}/test/python/"

  sanitize:
    name: sanitize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python Virtual Environment
        shell: bash
        run: |
          uv venv
          uv sync --extra dev --no-install-project

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B "${{ github.workspace }}/build-asan" \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DMAGNETRON_ASAN=ON \
                -DMAGNETRON_BUILD_BENCHMARKS=OFF \
                -DMAGNETRON_ENABLE_BACKEND_CUDA=OFF \
                -DPython_EXECUTABLE="${{ github.workspace }}/.venv/bin/python" \
                -S "${{ github.workspace }}"

      - name: Build C++ Runtime
        run: cmake --build "${{ github.workspace }}/build-asan" -j4

      - name: Run C++ Runtime Tests
        working-directory: "${{ github.workspace }}/build-asan"
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --verbose

      - name: Stage Python Package
        shell: bash
        run: |
          mkdir -p stage
          cp -r python/magnetron stage/
          cp build-asan/_magnetron_bindings*.so build-asan/libmagnetron_core.so build-asan/libmagnetron_cpu.so stage/magnetron/

      - name: Run Python Tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          PYTHONMALLOC: malloc
          MAG_LOG_LEVEL: debug
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export PYTHONPATH="${{ github.workspace }}/stage"
          .venv/bin/python -m pytest -n 4 -s "${{ github.workspace }}/test/python/"

  ci-passed:
    needs: [build, sanitize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.sanitize.result }}" != "success" ]; then
            echo "build matrix result: ${{ needs.build.result }}, sanitize result: ${{ needs.sanitize.result }}"
            exit 1
          fi
